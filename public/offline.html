<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>لا يوجد اتصال بالإنترنت — نظامي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0B3D2E;
    color: #f5f5f4;
    font-family: "Cairo", "Tahoma", "Segoe UI", Arial, sans-serif;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 380px;
    width: 100%;
  }
  .logo {
    font-size: 30px;
    font-weight: 800;
    color: #C8A762;
    letter-spacing: 0.5px;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 10px;
  }
  p {
    font-size: 14px;
    line-height: 1.7;
    color: rgba(245, 245, 244, 0.75);
    margin-bottom: 28px;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    background: #C8A762;
    color: #0B3D2E;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 12px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">نظامي</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصالك ثم أعد المحاولة</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
